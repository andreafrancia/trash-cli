# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]

jobs:
  run_tests:
    name: Run Python Tests
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, python_version: '2.7', container: 'python:2.7' }
          - { os: ubuntu-latest, python_version: '3.8' }
          - { os: ubuntu-latest, python_version: '3.14' }
          - { os: macos-latest, python_version: '3.13' }

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: andreafrancia/setup-python@v1
      if: ${{ !matrix.container }}
      with:
        python-version: ${{ matrix.python_version }}
        cache-build: true
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt -r requirements.txt
    - name: Check Types
      run: ./scripts/check-types
      if: matrix.python_version != '2.7'
    - name: Run tests
      run: python -m pytest
  sdist:
    name: Test sdist creation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.6', '3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Test sdist
      run: scripts/test-sdist
