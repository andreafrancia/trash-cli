# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]

jobs:
  make_tester_image27:
    name: Test on 2.7
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build Docker Image for Python 2.7
      run: |
        ls -al support/python2.7
        docker build -t python-tester:local support/python2.7
  run_test27:
    name: Run Python Tests on 2.7
    runs-on: ubuntu-latest
    container: python-tester:local
    needs: [ make_tester_image27 ]
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: |
          pwd
          id -a
          virtualenv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          .venv/bin/pytest
  run_tests:
    name: Run Python Tests
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python_version: '3.8' }
          - { os: ubuntu-latest, python_version: '3.14' }
          - { os: macos-latest, python_version: '3.13' }

    runs-on: ${{ matrix.os }}
    steps:
    - name: Prepare tester user
      if: ${{ matrix.container }}
      run: |
        echo GITHUB_WORKSPACE=$GITHUB_WORKSPACE
        useradd --home-dir $GITHUB_WORKSPACE/ tester
        chown -R tester:tester $GITHUB_WORKSPACE/tester
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python_version }}
      uses: andreafrancia/setup-python@v1
      if: ${{ !matrix.container }}
      with:
        python-version: ${{ matrix.python_version }}
        cache-build: true
    - name: Upgrade pip
      run: | 
        python -m pip install --upgrade pip
    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt -r requirements.txt
    - name: Check Types
      run: ./scripts/check-types
      if: matrix.python_version != '2.7'
    - name: Run tests
      run: python -m pytest
      if: ${{ !matrix.container }}
    - name: Run tests with su - tester
      run:
        id -a
        su - tester -c "python -m pytest"
      if: ${{ matrix.container }}
  sdist:
    name: Test sdist creation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.6', '3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Test sdist
      run: scripts/test-sdist
