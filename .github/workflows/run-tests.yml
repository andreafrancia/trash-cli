# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]

jobs:
  run_tests:
    name: Run Python Tests
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, python_version: '2.7' }
          - { os: ubuntu-latest, python_version: '3.8' }
          - { os: ubuntu-latest, python_version: '3.14' }
          - { os: macos-latest, python_version: '3.13' }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up 3.5 Python, ${{ matrix.python_version }}
      if: ${{ matrix.python_version == '3.5' }}
      uses: actions/setup-python@v5
      env:
        # Workaround copied from
        # https://github.com/ytdl-org/youtube-dl/commit/a08f2b7e4567cdc50c0614ee0a4ffdff49b8b6e6
        PIP_TRUSTED_HOST: "pypi.python.org pypi.org files.pythonhosted.org"
      with:
        python-version: ${{ matrix.python_version }}
    # Step "Set up Python 2.7" inspired/copied from
    # https://github.com/ytdl-org/youtube-dl/blob/1e109aaee13a30e2a23f982410ffb3e4f73913df/.github/workflows/ci.yml
    # licensed under the "The Unlicense" license (http://unlicense.org/)
    - name: Set up Python 2.7
      id: setup-python-27
      if: ${{ matrix.python-version == '2.7' }}
      shell: bash
      run: |
        # Ubuntu 22.04 no longer has python-is-python2: fetch it
        curl -L "http://launchpadlibrarian.net/474693132/python-is-python2_2.7.17-4_all.deb" -o python-is-python2.deb
        sudo apt-get install -y python2
        sudo dpkg --force-breaks -i python-is-python2.deb
        echo "PYTHONHOME=/usr" >> "$GITHUB_ENV"
    - name: Set up Python ${{ matrix.python_version }}
      uses: andreafrancia/setup-python@v1
      if: ${{ matrix.python_version != '3.5' }}
      with:
        python-version: ${{ matrix.python_version }}
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: python -m pip install -r requirements-dev.txt -r requirements.txt
    - name: Check Types
      run: ./scripts/check-types
      if: matrix.python_version != '2.7'
    - name: Run tests
      run: python -m pytest
  sdist:
    name: Test sdist creation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.6', '3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Test sdist
      run: scripts/test-sdist
