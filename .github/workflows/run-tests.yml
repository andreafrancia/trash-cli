# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]

jobs:
  run_tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python_version }}
        cache: 'pip'
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: python -m pip install . '.[dev]'
    - name: Check Types
      run: ./scripts/check-types
    - name: Run tests
      run: python -m pytest
  sdist:
    name: Test sdist creation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.6', '3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Test sdist
      run: scripts/test-sdist
  macos:
    name: macOS (system Python)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    # We only check that the package works with the Python already
    # installed on the machine (we don't pin a version), so a contributor
    # who wants to hack on trash-cli on macOS can do it without first
    # installing a specific Python version.
    - name: Use preinstalled Python via venv
      run: |
        python3 -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: python -m pip install . '.[dev]'
    - name: Check Types
      run: ./scripts/check-types
    - name: Run tests
      run: python -m pytest
    - name: Test sdist
      run: scripts/test-sdist
