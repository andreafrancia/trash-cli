# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python test

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]

jobs:
  run_tests:
    name: Run Python Tests
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, python_version: '3.8' }
          - { os: ubuntu-latest, python_version: '3.14' }
          # macOS: we only check that the package works with the Python
          # already installed on the machine (we don't pin a version), so
          # a contributor who wants to hack on trash-cli on macOS can do
          # it without first installing a specific Python version.
          - { os: macos-latest, python_version: 'ignored-on-macos' }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up 3.5 Python, ${{ matrix.python_version }}
      if: ${{ matrix.python_version == '3.5' }}
      uses: actions/setup-python@v5
      env:
        # Workaround copied from
        # https://github.com/ytdl-org/youtube-dl/commit/a08f2b7e4567cdc50c0614ee0a4ffdff49b8b6e6
        PIP_TRUSTED_HOST: "pypi.python.org pypi.org files.pythonhosted.org"
      with:
        python-version: ${{ matrix.python_version }}
    - name: Set up Python ${{ matrix.python_version }}
      uses: andreafrancia/setup-python@v1
      if: ${{ matrix.python_version != '3.5' && matrix.os != 'macos-latest' }}
      with:
        python-version: ${{ matrix.python_version }}
        cache-build: 'true'
    - name: Use preinstalled Python via venv (macOS)
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        python3 -m venv .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install dependencies
      run: python -m pip install . '.[dev]'
    - name: Check Types
      run: ./scripts/check-types
    - name: Run tests
      run: python -m pytest
  sdist:
    name: Test sdist creation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.6', '3.11', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Test sdist
      run: scripts/test-sdist
