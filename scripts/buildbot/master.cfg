# -*- python -*-
# Buildbot master config: poll ~/trash-cli for changes on master and run
# scripts/pre-push. Runs under Buildbot's own Python 3 venv, not the project's.

Usage="""
# Install buildbot
python3 -m venv ~/buildbot-venv
~/buildbot-venv/bin/pip install buildbot buildbot-www buildbot-worker \
  buildbot-waterfall-view buildbot-console-view buildbot-grid-view

# create a new buildmaster for trash-cli
~/buildbot-venv/bin/buildbot create-master ~/buildbot-trash-cli
cp scripts/buildbot/master.cfg ~/buildbot-trash-cli/master.cfg

# start builtbot service
~/buildbot-venv/bin/buildbot start ~/buildbot-trash-cli
UI: http://localhost:8010
"""
#

import os

from buildbot.plugins import changes, schedulers, steps, util, worker

REPO = os.path.expanduser("~/trash-cli")
BRANCH = "master"

c = BuildmasterConfig = {}

c["buildbotNetUsageData"] = None
c["title"] = "trash-cli"
c["buildbotURL"] = "http://localhost:8010/"
c["protocols"] = {"pb": {"port": 9989}}
c["db"] = {"db_url": "sqlite:///state.sqlite"}

# Runs builds inside the master process: no separate worker to start.
c["workers"] = [worker.LocalWorker("local")]

c["change_source"] = [
    changes.GitPoller(
        REPO,
        workdir="gitpoller-workdir",
        branches=[BRANCH],
        pollInterval=30,
    )
]

c["schedulers"] = [
    schedulers.SingleBranchScheduler(
        name="master-changes",
        change_filter=util.ChangeFilter(branch=BRANCH),
        treeStableTimer=10,
        builderNames=["pre-push"],
    ),
    schedulers.ForceScheduler(name="force", builderNames=["pre-push"]),
]

factory = util.BuildFactory()
# Incremental keeps the .venv and .tox created by scripts/pre-push between builds.
factory.addStep(steps.Git(repourl=REPO, branch=BRANCH, mode="incremental"))
factory.addStep(
    steps.ShellCommand(
        name="pre-push",
        command=["scripts/pre-push"],
        haltOnFailure=True,
        timeout=3600,
        maxTime=7200,
    )
)

c["builders"] = [
    util.BuilderConfig(name="pre-push", workernames=["local"], factory=factory)
]

# Read-only web UI on localhost.
c["www"] = {
    "port": 8010,
    "plugins": {"waterfall_view": {}, "console_view": {}, "grid_view": {}},
}
