[tox]
envlist = py310
# Python 2.7 isn't tested via tox at all: tox 4 (the version installed by
# the ordinary dev venv) dropped support for driving legacy interpreters.
# See scripts/py27/ instead (wired into scripts/pre-push via
# scripts/py27/check-all).

[testenv:mypy]
deps =
    mypy
    types-six
    types-mock
    types-psutil
commands =
    mypy --python-version 3.10 trashcli
    mypy --python-version 3.14 trashcli
    
[testenv]
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest {posargs}
